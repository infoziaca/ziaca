<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jeton apprenant - ZIACA</title>

    <style>

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .carte {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin: 5px 0;
        }

        .titre {
            color: #b8860b;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .photo {
            width: 150px;
            height: 180px;
            object-fit: cover;
            border: 3px solid #d4a017;
            border-radius: 8px;
            display: block;
            margin: 0 auto 15px auto;
        }

        .nom {
            font-size: 21px;
            font-weight: bold;
            margin: 15px 0;
        }

        .infos {
            text-align: left;
            line-height: 1.9;
        }

        .infos strong {
            color: #9a7200;
        }

        .valide {
            margin-top: 20px;
            padding: 12px;
            background: #e8f5e9;
            color: #188038;
            border-radius: 8px;
            font-weight: bold;
        }

        .expire {
            margin-top: 20px;
            padding: 12px;
            background: #fff3cd;
            color: #856404;
            border-radius: 8px;
            font-weight: bold;
        }

        .erreur {
            color: #b00020;
            font-weight: bold;
            line-height: 1.6;
        }

        .chargement {
            color: #555;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="carte">

    <h1>ZIACA</h1>

    <div class="titre">
        JETON APPRENANT
    </div>

    <div id="contenu">

        <div class="chargement">
            Chargement...
        </div>

    </div>

</div>


<script>


/* =====================================================
   PARAMETRE DU QR CODE
   ===================================================== */

const parametres =
    new URLSearchParams(
        window.location.search
    );


const id =
    parametres.get("id");


const contenu =
    document.getElementById("contenu");


/* =====================================================
   VERIFICATION DE L'ID
   ===================================================== */

if (!id) {

    contenu.innerHTML = `

        <div class="erreur">

            Aucun identifiant de jeton fourni.

        </div>

    `;

}


/* =====================================================
   CHARGEMENT DE APPRENANTS.JSON
   ===================================================== */

else {

    fetch(
        "apprenants.json?cache=" +
        new Date().getTime()
    )

    .then(function(response) {

        if (!response.ok) {

            throw new Error(
                "Impossible de charger apprenants.json"
            );

        }

        return response.json();

    })


    .then(function(apprenants) {


        /* =============================================
           RECHERCHE DE L'APPRENANT
           ============================================= */

        const apprenant =
            apprenants.find(function(personne) {

                return String(personne.id).trim() ===
                       String(id).trim();

            });


        /* =============================================
           APPRENANT NON TROUVE
           ============================================= */

        if (!apprenant) {

            contenu.innerHTML = `

                <div class="erreur">

                    CE JETON N'EST PLUS ACTIF.

                    <br><br>

                    Veuillez contacter
                    l'administration de ZIACA.

                </div>

            `;

            return;

        }


        /* =============================================
           VERIFICATION DE LA DATE
           ============================================= */

        const aujourdHui =
            new Date();


        aujourdHui.setHours(
            0,
            0,
            0,
            0
        );


        let dateFin = null;


        if (apprenant.dateFin) {

            dateFin =
                new Date(
                    apprenant.dateFin +
                    "T00:00:00"
                );

        }


        /* =============================================
           JETON EXPIRE
           ============================================= */

        if (
            dateFin &&
            aujourdHui > dateFin
        ) {

            contenu.innerHTML = `

                <div class="expire">

                    JETON EXPIRÉ

                    <br><br>

                    La période de validité
                    de ce jeton est terminée.

                    <br><br>

                    Veuillez contacter
                    l'administration de ZIACA.

                </div>

            `;

            return;

        }


        /* =============================================
           CONSTRUCTION DE L'URL DE LA PHOTO
           ============================================= */

        let urlPhoto = "";


        if (apprenant.photo) {

            let cheminPhoto =
                String(
                    apprenant.photo
                ).trim();


            /*
             * Si le JSON contient :
             *
             * apprenants/photo.jpg
             *
             * on construit :
             *
             * /ziaca/apprenants/photo.jpg
             */


            if (
                cheminPhoto.startsWith("/")
            ) {

                urlPhoto =
                    "https://infoziaca.github.io" +
                    cheminPhoto;

            }

            else {

                urlPhoto =
                    "https://infoziaca.github.io/ziaca/" +
                    cheminPhoto;

            }

        }


        /* =============================================
           AFFICHAGE DU JETON
           ============================================= */

        contenu.innerHTML = `

            <img
                class="photo"
                id="photoApprenant"
                src="${urlPhoto}"
                alt="Photo de ${apprenant.nom}"
            >

            <div class="nom">

                ${apprenant.nom}

            </div>


            <div class="infos">

                <div>
                    <strong>Sexe :</strong>
                    ${apprenant.sexe || ""}
                </div>


                <div>
                    <strong>Filière :</strong>
                    ${apprenant.filiere || ""}
                </div>


                <div>
                    <strong>Promotion :</strong>
                    ${apprenant.promotion || ""}
                </div>


                <div>
                    <strong>ID N° :</strong>
                    ${apprenant.id || ""}
                </div>


                <div>
                    <strong>Validité :</strong>
                    ${apprenant.dateDebut || ""}
                    au
                    ${apprenant.dateFin || ""}
                </div>

            </div>


            <div class="valide">

                ✓ JETON ZIACA VALIDE

            </div>

        `;


        /* =============================================
           VERIFICATION DU CHARGEMENT DE LA PHOTO
           ============================================= */

        const image =
            document.getElementById(
                "photoApprenant"
            );


        image.onerror = function() {

            /*
             * Si la photo n'est pas trouvée,
             * on affiche un message clair.
             */

            image.style.display = "none";


            const messagePhoto =
                document.createElement("div");


            messagePhoto.className =
                "erreur";


            messagePhoto.style.marginBottom =
                "15px";


            messagePhoto.innerHTML =

                "Photo indisponible.";


            contenu.insertBefore(
                messagePhoto,
                document.querySelector(".nom")
            );

        };

    })


    /* =================================================
       ERREUR DE CHARGEMENT
       ================================================= */

    .catch(function(error) {

        console.error(error);


        contenu.innerHTML = `

            <div class="erreur">

                Impossible de charger
                les informations du jeton.

                <br><br>

                Veuillez réessayer plus tard.

            </div>

        `;

    });

}

</script>


</body>

</html>
