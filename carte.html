<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de service - ZIACA</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .carte {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin: 5px;
        }

        .titre {
            color: #b8860b;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .photo {
            width: 150px;
            height: 180px;
            object-fit: cover;
            border: 3px solid #d4a017;
            border-radius: 8px;
        }

        .nom {
            font-size: 21px;
            font-weight: bold;
            margin: 15px 0;
        }

        .infos {
            text-align: left;
            line-height: 1.9;
        }

        .infos strong {
            color: #9a7200;
        }

        .valide {
            margin-top: 20px;
            padding: 10px;
            background: #e8f5e9;
            color: #188038;
            border-radius: 8px;
            font-weight: bold;
        }

        .erreur {
            color: #b00020;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="carte">

    <h1>ZIACA</h1>

    <div class="titre">
        CARTE DE SERVICE
    </div>

    <div id="contenu">
        Chargement...
    </div>

</div>

<script>

const parametres = new URLSearchParams(window.location.search);
const matricule = parametres.get("id");
const contenu = document.getElementById("contenu");

fetch("agents.json")
.then(response => {

    if (!response.ok) {
        throw new Error("Impossible de charger les agents");
    }

    return response.json();

})
.then(agents => {

    const agent = agents.find(
        personne => personne.matricule === matricule
    );

    if (!agent) {

        contenu.innerHTML = `
            <div class="erreur">
                Carte de service non trouvée.
            </div>
        `;

        return;
    }

    contenu.innerHTML = `

        <img
            class="photo"
            src="${agent.photo}"
            alt="Photo de ${agent.nom}"
        >

        <div class="nom">
            ${agent.nom}
        </div>

        <div class="infos">

            <div>
                <strong>N° carte :</strong>
                ${agent.numero}
            </div>

            <div>
                <strong>Sexe :</strong>
                ${agent.sexe}
            </div>

            <div>
                <strong>Département :</strong>
                ${agent.departement}
            </div>

            <div>
                <strong>Fonction :</strong>
                ${agent.fonction}
            </div>

            <div>
                <strong>Matricule :</strong>
                ${agent.matricule}
            </div>

        </div>

        <div class="valide">
            ✓ CARTE DE SERVICE ZIACA
        </div>
    `;

})
.catch(error => {

    contenu.innerHTML = `
        <div class="erreur">
            Impossible de charger les informations.
        </div>
    `;

});

</script>

</body>
</html>
